apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ussd-app1-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: ussd-app1.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ussd-app1-service
                port:
                  number: 8091